name: build
on:
  push:
    tags-ignore:
      - '*'
    branches:
      - master

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.8.x'
      - name: Determine Version
        id: version_step # step id used as reference for output values
        uses: gittools/actions/gitversion/execute@v4.7.0
      - name: Set Version
        run: echo "VERSION=${{ steps.version_step.outputs.FullSemVer }}" >> $GITHUB_ENV
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
      - name: Build with Gradle
        run: ./gradlew build -Dmod_version=${{steps.version_step.outputs.fullSemVer}}
      - name: Create Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          release: ${{steps.version_step.outputs.fullSemVer}}
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: v${{steps.version_step.outputs.fullSemVer}}
          path: build/libs/fargs-client-*-${{steps.version_step.outputs.fullSemVer}}.jar
      - name: Tag commit
        uses: tvdias/github-tagger@v0.0.1
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          tag: "v${{steps.version_step.outputs.fullSemVer}}"
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{steps.version_step.outputs.fullSemVer}}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            fabric/build/libs/fargs-client-fabric-${{steps.version_step.outputs.fullSemVer}}.jar
            neoforge/build/libs/fargs-client-neoforge-${{steps.version_step.outputs.fullSemVer}}.jar