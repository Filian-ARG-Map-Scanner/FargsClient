name: build
on:
  push:
    tags-ignore:
      - '*'
    branches:
      - master
jobs:
  version:
    runs-on: pve-cluster-runners
    outputs:
      version: ${{steps.version_step.outputs.semver}}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set DOTNET_INSTALL_DIR
        run: echo "DOTNET_INSTALL_DIR=$RUNNER_TOOL_CACHE/dotnet" >> $GITHUB_ENV
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.8.x'
      - name: Determine Version
        id: version_step # step id used as reference for output values
        uses: gittools/actions/gitversion/execute@v4.7.0
      - name: Set Version
        run: echo "SEMVER=${{ steps.version_step.outputs.semVer }}" >> $GITHUB_OUTPUT
  build:
    runs-on: pve-cluster-runners
    needs: version
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
      - name: UUID Action
        uses: filipstefansson/uuid-action@v1.1
        id: fabric_bundle_uuid

      - name: UUID Action
        uses: filipstefansson/uuid-action@v1.1
        id: neoforge_bundle_uuid

      - name: UUID Action
        uses: filipstefansson/uuid-action@v1.1
        id: common_bundle_uuid

      - name: Setup Sentry CLI
        uses: matbour/setup-sentry-cli@v3.0.0
        id: sentry_setup
      - name: Create Debug Info File
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          sentry-cli debug-files bundle-jvm --output fabric/build/generated/sentry --debug-id ${{ steps.fabric_bundle_uuid.outputs.uuid }} fabric/src/main/java
          sentry-cli debug-files bundle-jvm --output neoforge/build/generated/sentry --debug-id ${{ steps.neoforge_bundle_uuid.outputs.uuid }} neoforge/src/main/java
          sentry-cli debug-files bundle-jvm --output common/build/generated/sentry --debug-id ${{ steps.common_bundle_uuid.outputs.uuid }} common/src/main/java
          sentry-cli debug-files upload --type jvm neoforge/build/generated/sentry fabric/build/generated/sentry common/build/generated/sentry
      - uses: burrunan/gradle-cache-action@v3
        name: Build
        with:
          job-id: jdk21
          arguments: |
            build
            -Pmod_version=${{needs.version.outputs.version}}
            -Pfabric_bundle_uuid=${{ steps.fabric_bundle_uuid.outputs.uuid }}
            -Pneoforge_bundle_uuid=${{ steps.neoforge_bundle_uuid.outputs.uuid }}
            -Pcommon_bundle_uuid=${{ steps.common_bundle_uuid.outputs.uuid }}
          gradle-version: wrapper
      - name: Upload fabric jar
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: |
            fabric/build/libs/fargs-client-fabric-${{needs.version.outputs.version}}.jar
            neoforge/build/libs/fargs-client-neoforge-${{needs.version.outputs.version}}.jar
  create-release:
    runs-on: pve-cluster-runners-dind
    needs:
      - version
      - build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download fabric jar
        uses: actions/download-artifact@v8
        with:
          name: jars
      - name: Create Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          environment: production
          release: ${{needs.version.outputs.version}}
      - name: Create tag
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{needs.version.outputs.version}}',
              sha: context.sha
            })
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{needs.version.outputs.version}}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            fabric/build/libs/fargs-client-fabric-${{needs.version.outputs.version}}.jar
            neoforge/build/libs/fargs-client-neoforge-${{needs.version.outputs.version}}.jar
